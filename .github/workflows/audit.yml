name: sellerfact-audit

# 셀러팩트 무인 점검 — AI 토큰 0, 유료 API 0. 이 워크플로가 유일한 실행 주체다.
#  ① schedule      : 접수 큐(Apps Script)에서 대기 작업을 10분마다 가져와 점검
#  ② dispatch      : mode=queue (즉시 큐 처리) 또는 mode=single + job (지정 작업 1건)
#  ③ issue         : 제목이 [AUDIT]로 시작하는 이슈 = 접수 (GitHub 계정 보유 고객용 대체 창구)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "queue = 접수 큐 처리 / single = 지정 작업 1건 실행"
        required: false
        default: "single"
      job:
        description: "작업 ID (영문·숫자·하이픈) — mode=single일 때 필수"
        required: false
        default: ""
      client:
        description: "리포트에 표시할 셀러명"
        required: false
        default: "샘플 셀러"
      input_path:
        description: "입력 CSV 경로 (비우면 jobs/<job>.csv)"
        required: false
        default: ""
      offline:
        description: "인증 실시간 조회 없이 실행 (true/false)"
        required: false
        default: "false"
  repository_dispatch:
    types: [sellerfact-audit]
  schedule:
    - cron: "*/10 * * * *"
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: sellerfact-queue
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >
      github.event_name != 'issues' ||
      startsWith(github.event.issue.title, '[AUDIT]')
    env:
      KC_LOOKUP_TIMEOUT: "8"
      KC_CACHE_DIR: ${{ github.workspace }}/_cache
      QUEUE_ENDPOINT: ${{ secrets.QUEUE_ENDPOINT }}
      QUEUE_KEY: ${{ secrets.QUEUE_KEY }}
      REPORT_BASE: https://neo970720.github.io/sellerfact
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 의존성 설치
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet xlsxwriter==3.2.0 reportlab==4.2.5 openpyxl==3.1.5

      - name: 큐 처리 (schedule / mode=queue)
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'queue' || github.event.client_payload.mode == 'queue'
        run: python3 scripts/poll_queue.py

      - name: 지정 작업 실행 (mode=single)
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && github.event.inputs.mode != 'queue' && github.event.client_payload.mode != 'queue'
        env:
          JOB: ${{ github.event.inputs.job || github.event.client_payload.job }}
          CLIENT: ${{ github.event.inputs.client || github.event.client_payload.client }}
          INPUT_PATH: ${{ github.event.inputs.input_path }}
          OFFLINE: ${{ github.event.inputs.offline || github.event.client_payload.offline }}
        run: |
          set -euo pipefail
          if [ -z "${JOB:-}" ]; then echo "job 입력이 필요합니다"; exit 1; fi
          SRC="${INPUT_PATH:-jobs/${JOB}.csv}"
          if [ ! -f "$SRC" ]; then echo "입력 파일 없음: $SRC"; exit 1; fi
          EXTRA=""
          if [ "${OFFLINE:-false}" = "true" ]; then EXTRA="--no-network"; fi
          python3 scripts/run_job.py --job "$JOB" --input "$SRC" --client "${CLIENT:-셀러}" $EXTRA

      - name: 이슈 접수 처리 (issue)
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: python3 scripts/issue_job.py

      - name: 산출물 보관
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sellerfact-reports-${{ github.run_id }}
          path: |
            docs/r/**
            jobs/*.csv
          retention-days: 14
          if-no-files-found: warn

      - name: 결과 커밋 (GitHub Pages 배포)
        run: |
          set -euo pipefail
          git config user.name "sellerfact-bot"
          git config user.email "sellerfact-bot@users.noreply.github.com"
          git add -A docs/r jobs/_done.txt
          if git diff --cached --quiet; then
            echo "새 결과 없음"; exit 0
          fi
          git commit -m "report: 자동 점검 결과 $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for i in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            sleep 5; git pull --rebase --autostash origin main || true
          done
          echo "결과 푸시 실패"; exit 1

      - name: 게시 확인 후 큐 ack (고객 메일 발송)
        if: success() && (github.event_name == 'schedule' || github.event.inputs.mode == 'queue' || github.event.client_payload.mode == 'queue')
        run: python3 scripts/ack_jobs.py
